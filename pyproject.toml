[project]
name = "social-agent"
version = "0.1.0"
description = "Agent that shares new WordPress articles across social media platforms"
authors = [
    { name = "Agent" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "PyYAML>=6.0",
    "feedparser>=6.0.10",
    "python-dotenv>=1.0.0",
    "typer>=0.9.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
]

[project.scripts]
social-agent = "social_agent.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
